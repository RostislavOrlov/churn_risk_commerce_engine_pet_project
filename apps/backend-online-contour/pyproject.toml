[project]
name = "backend-online-contour"
version = "1.0.0"
description = "Real-Time Commerce & Logistics Control Tower Online Contour"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=23.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "redis>=5.1.0",
    "neo4j>=5.25.0",
    "catboost>=1.2.7",
    "numpy>=1.26.4",
    "celery>=5.4.0",
    "httpx>=0.27.2",
    "python-jose[cryptography]>=3.3.0",
    "prometheus-client>=0.21.0",
    "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "asgi-lifespan>=2.1.0",
    "locust>=2.31.0",
]
